[package]
name = "dinghy"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["gnome_47"] }
linkding-rs = "0.4.0"

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_6"]
