[package]
name = "dinghy"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
linkding-rs = "0.4.0"
ureq = "3.4"

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["gnome_50"]

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_9"]
